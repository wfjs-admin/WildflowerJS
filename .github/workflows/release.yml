name: Release

# Tag-triggered npm publish via OIDC trusted publishing.
# No npm token exists anywhere in this pipeline: npmjs.com is configured to
# trust this exact workflow file (wfjs-admin/WildflowerJS, release.yml), and
# npm generates signed SLSA provenance automatically on publish.
#
# Release flow: bump package.json version + CHANGELOG, push to main, then
# push the matching tag (e.g. v1.3.0). A prerelease tag (e.g. v1.3.0-rc.0)
# publishes under the "next" dist-tag instead of "latest".

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required: lets the workflow mint the OIDC token npm exchanges for publish rights
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Assert npm supports trusted publishing (>= 11.5.1)
        run: |
          required="11.5.1"
          actual="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -1)" != "$required" ]; then
            echo "npm $actual < $required — trusted publishing unsupported; bump node-version or add a pinned npm upgrade step"
            exit 1
          fi
          echo "npm $actual OK"

      - name: Assert tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg — bump package.json (and CHANGELOG) before tagging"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (vendored rollup + terser, SHA-512 pinned)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm (OIDC, provenance generated automatically)
        run: |
          if [ "${GITHUB_REF_NAME#*-}" != "$GITHUB_REF_NAME" ]; then
            echo "Prerelease tag — publishing under dist-tag 'next'"
            npm publish --tag next
          else
            npm publish
          fi

      - name: Verify published attestation
        # npm accepts a publish, signs the provenance, and THEN validates
        # asynchronously: its own output says "may take a few minutes to become
        # available", and the registry serves 404 for the version until that
        # finishes. At v1.5.0 it took about ten minutes. A fixed 15s sleep plus
        # one unguarded fetch therefore failed a release whose publish had
        # succeeded, and an empty body crashed JSON.parse with "Unexpected end
        # of JSON input", which reads like a broken artifact rather than a race.
        # Poll instead, and treat "not there yet" as not-yet rather than failure.
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://registry.npmjs.org/-/npm/v1/attestations/wildflowerjs@${version}"
          for attempt in $(seq 1 20); do
            body="$(curl -s --max-time 20 "$url" || true)"
            types="$(printf '%s' "$body" | node -e "
              let d='';
              process.stdin.on('data', c => d += c).on('end', () => {
                try {
                  const a = JSON.parse(d).attestations;
                  if (Array.isArray(a) && a.length) return console.log(a.map(x => x.predicateType).join(', '));
                } catch (e) { /* empty or not-yet-JSON: fall through */ }
                process.exit(1);
              });" 2>/dev/null || true)"
            if [ -n "$types" ]; then
              echo "attestations: $types (after ${attempt} attempt(s))"
              exit 0
            fi
            echo "attempt ${attempt}/20: attestation not published yet, waiting 30s"
            sleep 30
          done
          echo "::error::No attestation after 10 minutes. The publish step above may still have SUCCEEDED —"
          echo "::error::check 'npm view wildflowerjs@${version}' and 'npm audit signatures' on a fresh install"
          echo "::error::before assuming otherwise. Do NOT re-run this whole job: npm refuses to republish a version."
          exit 1
